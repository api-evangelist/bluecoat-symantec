name: Bluecoat (Symantec)
description: Blue Coat Systems was a web-security and network-forensics vendor best known for its ProxySG secure
  web gateway appliances, SSL Visibility, WebPulse/Global Intelligence Network threat intelligence, and cloud web
  security (the Web Security Service). Bain Capital led a consortium that took Blue Coat private in 2015; Symantec
  acquired the company in 2016, and Broadcom acquired Symantec's enterprise security business in 2019. Blue Coat's
  technology now ships inside Broadcom's Symantec Enterprise Cloud portfolio as Cloud Secure Web Gateway (Cloud
  SWG), Secure Web Gateway (ProxySG/ASG), SSL Visibility, CASB (CloudSOC), and DLP. Product documentation and REST
  APIs are published on the Broadcom TechDocs portal.
